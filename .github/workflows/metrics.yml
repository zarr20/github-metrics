name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["main"]}

jobs:
  github-metrics:
    environment: prd
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      # Activity SVG (full history)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: activity
          config_timezone: Asia/Jakarta
          filename: /public/github-metrics-activity.svg

      # Languages SVG
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css
          config_timezone: Asia/Jakarta
          filename: /public/github-metrics-languages.svg

      # Stars SVG
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          plugin_stars: yes
          plugin_stars_limit: 10       # top 10 repos
          config_timezone: Asia/Jakarta
          filename: /public/github-metrics-stars.svg

      # Habits SVG (full history)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 9999      # all days
          plugin_habits_facts: yes
          plugin_habits_from: all       # full contribution history
          config_timezone: Asia/Jakarta
          filename: /public/github-metrics-habits.svg
