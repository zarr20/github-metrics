name: Metrics
on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: metrics-prd
  cancel-in-progress: true

jobs:
  github-metrics:
    environment: prd
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Checkout repo
      - uses: actions/checkout@v3

      # Ensure public folder exists
      - name: Ensure public folder
        run: mkdir -p public

      # Generate all metrics in one step
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity
          config_timezone: Asia/Jakarta

          # Habits full history
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 9999
          plugin_habits_facts: yes
          plugin_habits_from: all
          plugin_habits_filename: public/github-metrics-habits.svg

          # Languages
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_ignored: html, css
          plugin_languages_filename: public/github-metrics-languages.svg

          # Stars
          plugin_stars: yes
          plugin_stars_limit: 10
          plugin_stars_filename: public/github-metrics-stars.svg

          # Activity
          plugin_activity: yes
          plugin_activity_filename: public/github-metrics-activity.svg

      # Commit & push generated SVGs
      - name: Commit Metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          files=$(find public -name "github-metrics-*.svg")
          if [ -n "$files" ]; then
            git add $files
            git commit -m "Update GitHub Metrics" || echo "No changes to commit"
            git push
          else
            echo "No SVG files found to commit"
          fi
