<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Metrics</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #0d1117; /* GitHub Dark Dimmed background */
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        footer {
            margin-top: 20px;
            font-size: 0.8rem;
            color: #8b949e;
        }
        a {
            color: #58a6ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
    <!-- Refresh page every hour to ensure fresh data if tab is kept open -->
    <meta http-equiv="refresh" content="3600">
</head>
<body>
    <div class="container">
        <!-- The image source matches the filename generated by the action -->
        <img src="github-metrics.svg" alt="GitHub Metrics" />
        <footer>
            <p>Generated by <a href="https://github.com/lowlighter/metrics" target="_blank">lowlighter/metrics</a></p>
            <p>Deployed on Vercel</p>
        </footer>
    </div>
</body>
</html>
